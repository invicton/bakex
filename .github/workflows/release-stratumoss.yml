name: Release stratumoss tombstone

# Publishes the `stratumoss` tombstone distribution in packaging/stratumoss/.
#
# `stratumoss` was this project's PyPI name while it was called Stratum (through
# v0.5.2). PyPI has no rename or redirect mechanism, so the only way to point people at
# BakeX is to publish a release whose metadata says so. This is expected to run once.
#
# Deliberately workflow_dispatch-only: it must never fire on a `v*` tag and race the
# main release.yml, which publishes a different distribution (`bakex`).
#
# Requires a trusted publisher configured on pypi.org for project `stratumoss`:
# owner invicton, repo bakex, workflow release-stratumoss.yml, environment
# pypi-stratumoss. Publishing fails until that exists.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm uploading to PyPI (irreversible)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build tombstone distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation (keyless OIDC)
      attestations: write
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "Confirmation input was not 'publish' — refusing to build/upload." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Build
        run: uv build -o dist packaging/stratumoss
      - name: Verify it is a tombstone, not a real package
        # Guards against this workflow ever shipping something with actual code in it.
        run: |
          uv run --no-project --with twine twine check dist/*
          python - <<'EOF'
          import glob, zipfile, sys
          whl = glob.glob("dist/stratumoss-*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          modules = [n for n in names if n.endswith(".py")]
          if modules != ["stratum/__init__.py"]:
              sys.exit(f"unexpected modules in tombstone wheel: {modules}")
          meta = zipfile.ZipFile(whl).read(
              [n for n in names if n.endswith("METADATA")][0]
          ).decode()
          if "Requires-Dist: bakex" not in meta:
              sys.exit("tombstone must depend on bakex so installs are not a dead end")
          print("tombstone verified:", whl)
          EOF
      - name: Attest dist build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-stratumoss
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-stratumoss
      url: https://pypi.org/project/stratumoss/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-stratumoss
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
